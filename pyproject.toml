[tool.poetry]
name = "netbox-plugin-prometheus-sd"
version = "2.0.0" # placeholder
description = "A Netbox plugin to provide Netbox entires to Prometheus HTTP service discovery"
authors = ["Felix Peters <felix.peters@breuninger.de>"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "netbox_prometheus_sd" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
invoke = ">=2.2,<4.0"
docker = "^7.1.0"
testcontainers = {extras = ["postgres", "redis", "generic"], version = "^4.14.1"}
python-semantic-release = "^10.5.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["netbox_prometheus_sd/__init__.py:__VERSION__"]
build_command = "pip install poetry && poetry build"
# The release commit is pushed with a PAT (see release.yaml), and unlike
# GITHUB_TOKEN a PAT does trigger workflows -- so without `[skip ci]` every
# release would start a second CI and SemanticRelease run on its own bump
# commit. The `chore(release):` prefix keeps the subject conventional, so
# commitlint stays green if the skip ever fails to apply.
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.prerelease]
# Matches branches with the prefixes 'pre/'.
match = "^(pre)/.+"
prerelease = true
prerelease_token = "pre"
